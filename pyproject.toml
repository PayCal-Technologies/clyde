[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "clyde"
version = "0.1.0"
description = "Stream audited repository source bundles into NotebookLM."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Clyde contributors" }]
keywords = ["notebooklm", "repository", "mcp", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
clyde = "clyde.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
