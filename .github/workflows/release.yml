name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Check Go
        run: .github/scripts/install-go.sh linux amd64
      - name: GitHub policy guard
        shell: bash
        run: .github/scripts/check-github-policy.sh
      - name: Verify version tag
        run: |
          version="$(cat VERSION)"
          test "v${version}" = "${GITHUB_REF_NAME}"
          grep -q "productVersion     = \"${version}\"" internal/clyde/cli.go
      - name: Test
        run: go test ./...
      - name: Build archives
        shell: bash
        run: .github/scripts/build-release.sh
      - name: Generate SPDX SBOM
        shell: bash
        run: .github/scripts/generate-sbom.sh
      - name: Smoke test release archives
        shell: bash
        run: .github/scripts/smoke-release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
          fi
      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/clyde-published-assets
          gh release download "${GITHUB_REF_NAME}" --dir /tmp/clyde-published-assets
          if command -v sha256sum >/dev/null 2>&1; then
            (cd /tmp/clyde-published-assets && sha256sum -c SHA256SUMS)
          else
            (cd /tmp/clyde-published-assets && shasum -a 256 -c SHA256SUMS)
          fi
