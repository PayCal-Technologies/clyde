name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git remote remove origin
      - name: Check Go
        run: .github/scripts/install-go.sh linux amd64
      - name: GitHub policy guard
        shell: bash
        run: .github/scripts/check-github-policy.sh
      - name: Verify version tag
        run: |
          version="$(cat VERSION)"
          test "v${version}" = "${GITHUB_REF_NAME}"
          grep -q "productVersion     = \"${version}\"" internal/clyde/cli.go
      - name: Test
        run: go test ./...
      - name: Build archives
        shell: bash
        run: .github/scripts/build-release.sh
      - name: Generate user-facing release notes
        shell: bash
        run: .github/scripts/generate-release-notes.sh
      - name: Generate SPDX SBOM
        shell: bash
        run: .github/scripts/generate-sbom.sh
      - name: Generate SLSA provenance
        shell: bash
        run: .github/scripts/generate-provenance.sh
      - name: Sign release provenance
        shell: bash
        run: .github/scripts/sign-release-provenance.sh
      - name: Write final release checksums
        shell: bash
        run: .github/scripts/write-release-checksums.sh
      - name: Smoke test release archives
        shell: bash
        run: .github/scripts/smoke-release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release already exists; refusing to replace assets" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --notes-file dist/RELEASE_NOTES.md
          gh release upload "${GITHUB_REF_NAME}" dist/*
      - name: Verify draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/clyde-published-assets
          gh release download "${GITHUB_REF_NAME}" --dir /tmp/clyde-published-assets
          cmp dist/SHA256SUMS /tmp/clyde-published-assets/SHA256SUMS
          if command -v sha256sum >/dev/null 2>&1; then
            (cd /tmp/clyde-published-assets && sha256sum -c SHA256SUMS)
          else
            (cd /tmp/clyde-published-assets && shasum -a 256 -c SHA256SUMS)
          fi
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
