name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Verify version tag
        run: |
          version="$(cat VERSION)"
          test "v${version}" = "${GITHUB_REF_NAME}"
          grep -q "productVersion     = \"${version}\"" internal/clyde/cli.go
      - name: Test
        run: go test ./...
      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="$(cat VERSION)"
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              name="clyde_${version}_${goos}_${goarch}"
              bin="clyde"
              if [ "$goos" = "windows" ]; then bin="clyde.exe"; fi
              mkdir -p "dist/${name}"
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
                -trimpath \
                -ldflags "-s -w" \
                -o "dist/${name}/${bin}" ./cmd/clyde
              cp README.md LICENSE VERSION "dist/${name}/"
              if [ "$goos" = "windows" ]; then
                (cd dist && zip -qr "${name}.zip" "${name}")
              else
                tar -C dist -czf "dist/${name}.tar.gz" "${name}"
              fi
              rm -rf "dist/${name}"
            done
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: Smoke test release archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          mkdir -p /tmp/clyde-release-smoke
          tar -C /tmp/clyde-release-smoke -xzf "dist/clyde_${version}_linux_amd64.tar.gz"
          /tmp/clyde-release-smoke/clyde_${version}_linux_amd64/clyde --about
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/clyde.spdx.json
      - name: Attest artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
