name: Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Check Go
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '$1 == "go" { print $2 }' go.mod)"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$os" in
            linux*) goos="linux" ;;
            darwin*) goos="darwin" ;;
            mingw*|msys*|cygwin*) goos="windows" ;;
            *) echo "unsupported OS: $os" >&2; exit 1 ;;
          esac
          case "$arch" in
            x86_64|amd64) goarch="amd64" ;;
            arm64|aarch64) goarch="arm64" ;;
            *) echo "unsupported architecture: $arch" >&2; exit 1 ;;
          esac
          rm -rf "${RUNNER_TEMP}/go"
          if [ "$goos" = "windows" ]; then
            curl -fsSLo "${RUNNER_TEMP}/go.zip" "https://go.dev/dl/go${version}.${goos}-${goarch}.zip"
            unzip -q "${RUNNER_TEMP}/go.zip" -d "${RUNNER_TEMP}"
          else
            curl -fsSLo "${RUNNER_TEMP}/go.tar.gz" "https://go.dev/dl/go${version}.${goos}-${goarch}.tar.gz"
            tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/go.tar.gz"
          fi
          echo "${RUNNER_TEMP}/go/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/go/bin/go" version
      - name: Verify gofmt
        if: runner.os != 'Windows'
        run: test -z "$(find . -name '*.go' -print0 | xargs -0 gofmt -l)"
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./internal/clyde
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/clyde
      - name: CLI smoke
        shell: bash
        run: |
          go run ./cmd/clyde --about
          go run ./cmd/clyde help --json
          go run ./cmd/clyde bundle verify /no/such/bundle >/tmp/clyde-smoke.out 2>/tmp/clyde-smoke.err && exit 1 || true
      - name: Fuzz smoke
        if: runner.os == 'Linux'
        run: |
          go test ./internal/clyde -run '^$' -fuzz=FuzzSplitTextPreservesUTF8 -fuzztime=5s
          go test ./internal/clyde -run '^$' -fuzz=FuzzJSONRPCEnvelopeDecode -fuzztime=5s
          go test ./internal/clyde -run '^$' -fuzz=FuzzGlobMatching -fuzztime=5s
          go test ./internal/clyde -run '^$' -fuzz=FuzzSecretDetection -fuzztime=5s

  analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Check Go
        run: |
          set -euo pipefail
          version="$(awk '$1 == "go" { print $2 }' go.mod)"
          rm -rf "${RUNNER_TEMP}/go"
          curl -fsSLo "${RUNNER_TEMP}/go.tar.gz" "https://go.dev/dl/go${version}.linux-amd64.tar.gz"
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/go.tar.gz"
          echo "${RUNNER_TEMP}/go/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/go/bin/go" version
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.0
          staticcheck ./...
      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
