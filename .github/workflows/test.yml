name: Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git remote remove origin
      - name: Check Go
        shell: bash
        run: .github/scripts/install-go.sh
      - name: GitHub policy guard
        if: runner.os == 'Linux'
        shell: bash
        run: .github/scripts/check-github-policy.sh
      - name: Verify gofmt
        if: runner.os != 'Windows'
        run: test -z "$(find . -name '*.go' -print0 | xargs -0 gofmt -l)"
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./internal/clyde
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/clyde
      - name: Check generated manual page
        shell: bash
        run: .github/scripts/generate-man-page.sh --check
      - name: CLI smoke
        shell: bash
        run: |
          go run ./cmd/clyde --about
          go run ./cmd/clyde help --json
          go run ./cmd/clyde bundle verify /no/such/bundle >/tmp/clyde-smoke.out 2>/tmp/clyde-smoke.err && exit 1 || true
      - name: Fuzz smoke
        if: runner.os == 'Linux'
        run: |
          go test ./internal/clyde -run '^$' -fuzz=FuzzSplitTextPreservesUTF8 -fuzztime=5s
          go test ./internal/clyde -run '^$' -fuzz=FuzzJSONRPCEnvelopeDecode -fuzztime=5s
          go test ./internal/clyde -run '^$' -fuzz=FuzzGlobMatching -fuzztime=5s
          go test ./internal/clyde -run '^$' -fuzz=FuzzSecretDetection -fuzztime=5s

  analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git remote remove origin
      - name: Check Go
        run: .github/scripts/install-go.sh linux amd64
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.0
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...
